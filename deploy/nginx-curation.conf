# Nginx on the Linux VM: copy to /etc/nginx/conf.d/curation.conf
# The HTTPS certificate is provided by IT.
server {
    listen 443 ssl;
    server_name curation.internal;                # name given by IT

    ssl_certificate     /etc/ssl/curation/cert.pem;
    ssl_certificate_key /etc/ssl/curation/key.pem;

    client_max_body_size 20M;                     # CSV / referential imports

    # Everything (dashboard + API) is served by FastAPI
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;                  # report generation can take a while
    }

    # Live updates (Server-Sent Events): no buffering
    location /api/events {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
